<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>EDUBRIDGE Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: "Segoe UI", Arial, sans-serif;
    background: #f7faff;
    color: #092866;
    min-height: 100vh;
    overflow-x: hidden;
}

/* ================= HEADER ================= */

header {
    height: 110px;
    background: linear-gradient(135deg, #061d55, #082b70);
    color: white;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 3%;
    position: relative;
    z-index: 10;
}

/* Logo */

.logo {
    display: flex;
    align-items: center;
    gap: 14px;
}

.logo-icon {
    font-size: 48px;
}

.logo h1 {
    font-size: 28px;
}

.logo h1 span {
    color: #ffd21c;
}

.logo p {
    font-size: 13px;
    color: #e6ecff;
}

/* Navigation */

nav {
    display: flex;
    gap: 10px;
}

nav a {
    color: white;
    text-decoration: none;

    padding: 15px 25px;

    border-radius: 15px;

    font-weight: 600;
    font-size: 16px;
}

nav a:hover,
nav a.active {
    background: rgba(255,255,255,0.12);
}

/* User */

.user-area {
    display: flex;
    align-items: center;
    gap: 12px;
}

.user-icon {
    width: 52px;
    height: 52px;

    border-radius: 50%;

    background: #1877f2;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 26px;
}

.user-info {
    font-size: 13px;
}

.user-info strong {
    display: block;
}

.user-info span {
    color: #ffd21c;
    font-weight: bold;
}

.logout {
    color: white;
    text-decoration: none;

    border: 1px solid rgba(255,255,255,0.7);

    padding: 10px 20px;

    border-radius: 22px;
}

.logout:hover {
    background: rgba(255,255,255,0.1);
}


/* ================= BACKGROUND ================= */

.shape-left {
    position: fixed;

    width: 330px;
    height: 330px;

    top: 110px;
    left: -100px;

    background: #e0ecff;

    border-radius: 0 0 55% 0;

    z-index: 0;
}

.shape-right {
    position: fixed;

    width: 390px;
    height: 390px;

    right: -100px;
    bottom: -120px;

    background: #eee2ff;

    border-radius: 60% 0 0 0;

    z-index: 0;
}

/* Dots */

.dots {
    position: fixed;

    width: 100px;
    height: 100px;

    background-image:
        radial-gradient(#c3d8ff 3px, transparent 3px);

    background-size: 22px 22px;

    opacity: 0.75;

    z-index: 0;
}

.dots-left {
    top: 160px;
    left: 25px;
}

.dots-right {
    top: 140px;
    right: 25px;
}


/* ================= MAIN ================= */

main {
    position: relative;
    z-index: 2;

    max-width: 1100px;

    margin: auto;

    padding: 30px 20px 60px;
}


/* Heading */

.dashboard-heading {
    text-align: center;

    margin-bottom: 30px;
}

.dashboard-heading .cap {
    font-size: 34px;

    color: #f6c515;

    margin-bottom: 5px;
}

.dashboard-heading h2 {
    font-size: 38px;

    color: #082b70;

    margin-bottom: 8px;
}

.dashboard-heading p {
    font-size: 20px;

    color: #30466f;
}

.heading-line {
    width: 80px;
    height: 3px;

    background: #1769e0;

    margin: 14px auto 0;

    border-radius: 10px;
}


/* ================= PROGRESS ================= */

.progress-card {
    background: white;

    border-radius: 18px;

    padding: 25px 28px;

    box-shadow: 0 8px 25px rgba(20,50,100,0.10);

    margin-bottom: 24px;
}

.progress-title {
    display: flex;
    align-items: center;

    gap: 15px;

    margin-bottom: 18px;
}

.progress-icon {
    width: 55px;
    height: 55px;

    border-radius: 50%;

    background: #e5f0ff;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 28px;
}

.progress-title h3 {
    font-size: 24px;
}

.progress-bar {
    height: 16px;

    width: 100%;

    background: #e1e7f1;

    border-radius: 20px;

    overflow: hidden;
}

.progress-fill {
    height: 100%;

    width: 40%;

    background: linear-gradient(
        90deg,
        #155be8,
        #3157e8
    );

    border-radius: 20px;
}

.progress-percent {
    text-align: center;

    font-size: 30px;

    font-weight: bold;

    color: #1553c9;

    margin-top: 14px;
}


/* ================= STAT CARDS ================= */

.stats {
    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 22px;

    margin-bottom: 24px;
}

.stat-card {
    background: white;

    min-height: 160px;

    border-radius: 17px;

    padding: 20px 25px;

    box-shadow:
        0 8px 25px rgba(20,50,100,0.10);

    position: relative;

    overflow: hidden;
}

.stat-card::after {
    content: "";

    position: absolute;

    width: 130px;
    height: 100px;

    right: -40px;
    bottom: -35px;

    border-radius: 60% 0 0 0;

    opacity: 0.6;
}

.video-card::after {
    background: #e4f0ff;
}

.mock-card::after {
    background: #f0e3ff;
}

.score-card::after {
    background: #e1f7eb;
}

.stat-top {
    display: flex;

    align-items: center;

    gap: 15px;
}

.stat-icon {
    width: 55px;
    height: 55px;

    border-radius: 50%;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 26px;
}

.video-card .stat-icon {
    background: #e3efff;
}

.mock-card .stat-icon {
    background: #f0e3ff;
}

.score-card .stat-icon {
    background: #e0f6e9;
}

.stat-card h3 {
    font-size: 20px;
}

.stat-number {
    text-align: center;

    font-size: 38px;

    font-weight: bold;

    margin-top: 15px;
}

.video-card .stat-number {
    color: #1555cf;
}

.mock-card .stat-number {
    color: #5420a8;
}

.score-card .stat-number {
    color: #087052;
}


/* ================= CHART ================= */

.chart-card {
    background: white;

    border-radius: 18px;

    padding: 25px;

    box-shadow:
        0 8px 25px rgba(20,50,100,0.10);
}

.chart-title {
    display: flex;

    align-items: center;

    gap: 15px;

    margin-bottom: 20px;
}

.chart-icon {
    width: 55px;
    height: 55px;

    border-radius: 50%;

    background: #f0e7ff;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 27px;
}

.chart-title h3 {
    font-size: 24px;
}

.chart-container {
    height: 320px;
}


/* ================= RESPONSIVE ================= */

@media(max-width: 1000px) {

    header {
        height: auto;

        padding: 18px 3%;

        flex-wrap: wrap;

        gap: 15px;
    }

    nav {
        order: 3;

        width: 100%;

        justify-content: center;
    }

    .user-area {
        margin-left: auto;
    }

    .stats {
        grid-template-columns:
            repeat(3, 1fr);
    }
}


@media(max-width: 700px) {

    header {
        justify-content: center;
    }

    .logo {
        justify-content: center;
    }

    nav a {
        padding: 10px 12px;

        font-size: 13px;
    }

    .user-area {
        display: none;
    }

    .dashboard-heading h2 {
        font-size: 30px;
    }

    .stats {
        grid-template-columns: 1fr;
    }

    .progress-card {
        padding: 20px;
    }

    .chart-container {
        height: 250px;
    }
}

</style>
</head>


<body>


<!-- Background -->

<div class="shape-left"></div>

<div class="shape-right"></div>

<div class="dots dots-left"></div>

<div class="dots dots-right"></div>


<!-- ================= HEADER ================= -->

<header>

    <div class="logo">

        <div class="logo-icon">
            📖
        </div>

        <div>

            <h1>
                EDU-<span>BRIDGE</span>
            </h1>

            <p>
                Guiding Students from 10th to Higher Studies
            </p>

        </div>

    </div>


    <nav>

        <a href="front.html">
            🏠 Home
        </a>

        <a href="#">
            💬 Doubt Session
        </a>

        <a href="dashboard.html" class="active">
            ▦ Dashboard
        </a>

    </nav>


    <div class="user-area">

        <div class="user-icon">
            👤
        </div>

        <div class="user-info">

            Logged in as:

            <strong>
                <span id="user-email">
                    Student
                </span>
            </strong>

        </div>

        <a
            href="login.html"
            class="logout">
            ⇥ Logout
        </a>

    </div>

</header>


<!-- ================= MAIN ================= -->

<main>


    <!-- Heading -->

    <section class="dashboard-heading">

        <div class="cap">
            🎓
        </div>

        <h2>
            EDUBRIDGE Dashboard
        </h2>

        <p>
            Welcome, <span id="student-name">Student</span>! 👋
        </p>

        <div class="heading-line"></div>

    </section>


    <!-- Overall Progress -->

    <section class="progress-card">

        <div class="progress-title">

            <div class="progress-icon">
                📈
            </div>

            <h3>
                Overall Progress
            </h3>

        </div>


        <div class="progress-bar">

            <div
                class="progress-fill"
                id="progress-fill">
            </div>

        </div>


        <div
            class="progress-percent"
            id="progress-percent">
            0%
        </div>

    </section>


    <!-- Statistics -->

    <section class="stats">


        <!-- Videos -->

        <div class="stat-card video-card">

            <div class="stat-top">

                <div class="stat-icon">
                    ▶️
                </div>

                <h3>
                    Videos Completed
                </h3>

            </div>

            <div
                class="stat-number"
                id="videos-completed">
                0
            </div>

        </div>


        <!-- Mock Tests -->

        <div class="stat-card mock-card">

            <div class="stat-top">

                <div class="stat-icon">
                    📝
                </div>

                <h3>
                    Mock Tests
                </h3>

            </div>

            <div
                class="stat-number"
                id="mock-tests">
                0
            </div>

        </div>


        <!-- Average Score -->

        <div class="stat-card score-card">

            <div class="stat-top">

                <div class="stat-icon">
                    🏅
                </div>

                <h3>
                    Average Score
                </h3>

            </div>

            <div
                class="stat-number"
                id="average-score">
                0%
            </div>

        </div>

    </section>


    <!-- Performance Chart -->

    <section class="chart-card">

        <div class="chart-title">

            <div class="chart-icon">
                📊
            </div>

            <h3>
                Performance Chart
            </h3>

        </div>


        <div class="chart-container">

            <canvas id="performanceChart"></canvas>

        </div>

    </section>


</main>


<script src="dashboard.js"></script>

</body>
</html>
