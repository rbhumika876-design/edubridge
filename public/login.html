<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>EDUBRIDGE - Secure Authentication</title>
  <style>
    body { font-family: Arial, sans-serif; background: #0A192F; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
    .auth-container { background: white; padding: 40px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); width: 350px; text-align: center; }
    h2 { color: #001F5C; margin-bottom: 20px; }
    input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
    .btn { background: #001F5C; color: white; border: none; padding: 12px; width: 100%; border-radius: 5px; font-size: 1em; cursor: pointer; font-weight: bold; }
    .btn:hover { background: #0e7c94; }
    .toggle-msg { margin-top: 15px; font-size: 0.9em; color: #555; }
    .toggle-msg span { color: #0e7c94; cursor: pointer; font-weight: bold; }
  </style>
</head>
<body>

<div class="auth-container">
  <h2 id="form-title">Login to EDUBRIDGE</h2>
  <form id="auth-form">
    <input type="email" id="email" placeholder="Email Address" required>
    <input type="password" id="password" placeholder="Password" required>
    <button type="submit" class="btn" id="submit-btn">Login</button>
  </form>
  <p class="toggle-msg" id="toggle-text">Don't have an account? <span onclick="toggleMode()">Sign Up</span></p>
</div>

<script>
  let isLoginMode = true;

  function toggleMode() {
    isLoginMode = !isLoginMode;
    document.getElementById('form-title').innerText = isLoginMode ? 'Login to EDUBRIDGE' : 'Create Student Account';
    document.getElementById('submit-btn').innerText = isLoginMode ? 'Login' : 'Sign Up';
    document.getElementById('toggle-text').innerHTML = isLoginMode ? 
      `Don't have an account? <span onclick="toggleMode()">Sign Up</span>` : 
      `Already have an account? <span onclick="toggleMode()">Login</span>`;
  }

  document.getElementById('auth-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    const endpoint = isLoginMode ? '/api/login' : '/api/signup';

    try {
      const response = await fetch(endpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
      });
      const data = await response.json();

      if (response.ok) {
        if (isLoginMode) {
          localStorage.setItem('authToken', data.token);
          localStorage.setItem('userEmail', data.email);
          alert('Access Verification Confirmed.');
          window.location.href = 'front.html';
        } else {
          alert('Registration successful! Proceeding to log in.');
          toggleMode();
        }
      } else {
        alert(data.message);
      }
    } catch (err) {
      alert('Network transmission failed.');
    }
  });
</script>
</body>
</html>
